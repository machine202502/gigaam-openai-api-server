# GigaAM ASR — деплой через Docker Compose (self-hosted: Linux-сервер / NAS / мини-ПК).
#
# Запуск: `docker compose up -d --build` (UI управления контейнерами тоже подойдёт). Перед стартом:
#   1) Создайте рядом файл `.env` (см. .env.example) и задайте API_KEY.
#   2) Создайте каталог ./models и сделайте владельцем UID 1000 (chown 1000:1000 ./models),
#      иначе non-root в контейнере не сможет писать туда веса. См. README → «Деплой (Docker Compose)».
# Первый старт скачивает веса GigaAM в ./models (минуты) → затем healthcheck становится healthy.

services:
  gigaam-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gigaam-api:latest
    container_name: gigaam-api
    # required: false → без .env сервис стартует на дефолтах (config.py); для прода
    # создайте .env (см. .env.example) и задайте API_KEY — он подхватится автоматически.
    env_file:
      - path: .env
        required: false
    ports:
      # 8000 — API (OpenAI-совместимый), 8001 — веб-панель управления (автовыгрузка модели).
      - "8000:8000"
      - "8001:8001"
    volumes:
      # Кэш весов переживает пересоздание контейнера; первый старт скачивает веса сюда.
      - ./models:/data/models
    restart: unless-stopped
    healthcheck:
      # Без curl (его нет в slim) — stdlib urllib, exec-форма CMD. start_period щедрый под
      # скачивание весов при первом старте: пока они не загружены, uvicorn ещё не отвечает.
      # Проверяем только код 200 (не поле loaded): выгруженная по простою модель — это норма.
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

    # --- Лимиты ресурсов (типичный self-hosted хост: ~4 ядра / 8 ГБ) ---
    # Подберите под железо. Top-level mem_limit/cpus работают надёжнее
    # (Compose specification v2), чем deploy.resources (Swarm). Раскомментируйте при необходимости:
    # mem_limit: 6g
    # cpus: 4.0
    # Держите NUM_THREADS в .env ≤ числу выделенных ядер (torch.set_num_threads).

  # --- Опциональный прогрев весов (НЕ стартует с `up`; только через профиль `tools`) ---
  # Предскачивание весов в ./models без поднятия HTTP-сервиса (полезно для медленного/офлайн
  # хоста). Запуск: docker compose --profile tools run --rm download-weights
  download-weights:
    build:
      context: .
      dockerfile: Dockerfile
    image: gigaam-api:latest
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./models:/data/models
    command: ["python", "-m", "gigaam_api.download_weights"]
    restart: "no"
