[project]
name = "gigaam-api"
version = "0.3.0"
description = "OpenAI-совместимый сервис распознавания русской речи на базе GigaAM"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "torch>=2.13.0",
    "torchaudio>=2.6",
    "silero-vad>=6.2.1",
    "gigaam",
]

[project.scripts]
gigaam-api = "gigaam_api.serve:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gigaam_api"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Язык проекта — русский: комментарии, docstring и пользовательские строки на кириллице.
# RUF001/002/003 (ambiguous-unicode) отключены — они ищут символы-двойники ASCII в кириллице.
# Остальные правила RUF (например, RUF100 — неиспользуемый noqa) остаются включёнными.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# HTML/JS-разметка панели управления — длинные строки разметки не ограничиваем.
"gigaam_api/admin.py" = ["E501"]

[tool.ruff.format]
# Настройки форматтера ruff по умолчанию.

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

# gigaam (git-зависимость) и silero-vad не поставляют стабы / py.typed.
# Точечный ignore_missing_imports идиоматичнее широкого `# type: ignore`.
[[tool.mypy.overrides]]
module = ["gigaam.*", "silero_vad.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: требует реальную модель и/или сеть"]
addopts = "-q --strict-markers"

[tool.uv]
# onnx тянется транзитивно через gigaam, который жёстко пинит onnx==1.19.* в своих метаданных.
# У старого onnx открыты high/medium GHSA-уязвимости (все исправлены в 1.21.0), а Dependabot
# security-обновления не могут его поднять (пин делает резолв неразрешимым → job падает каждый
# запуск). Мы переопределяем версию здесь: gigaam не делает «голый» `import onnx` (только
# onnxruntime + torch.onnx.export), а этот сервис ONNX-экспорт не вызывает, поэтому форс новой
# onnx безопасен. См. ADR-лог в CLAUDE.md.
override-dependencies = ["onnx>=1.21.0"]

[tool.uv.sources]
gigaam = { git = "https://github.com/salute-developers/GigaAM.git", rev = "559d88d6b72541412743929f633a6ae7c9950b85" }
# torch/torchaudio: на Linux (Docker) — CPU-колёса из индекса PyTorch (без CUDA);
# на macOS (dev) — обычные колёса PyPI (с MPS). Единый uv.lock покрывает обе платформы
# через маркер платформы. См. ADR-лог в CLAUDE.md.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

# explicit = true → индекс используется ТОЛЬКО для torch/torchaudio (через sources выше);
# все остальные пакеты (onnxruntime и пр. из gigaam) берутся с обычного PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
